#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Single source of truth for the app version, shared by Android and iOS.
# CI overrides app.versionCode with the run number so every build is unique;
# locally it stays 1, which is all a debug install needs.
app.versionName=1.0.0
app.versionCode=1
